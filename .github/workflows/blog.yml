name: Sync blog from issues

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]

permissions:
  contents: write
  issues: read

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild posts.json from "post"-labeled issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --author "${{ github.repository_owner }}" \
            --state open \
            --json number,title,body,createdAt,labels \
            --limit 500 \
          | jq '[ .[]
                  | select(.labels | any(.name == "post"))
                  | { id: (.number | tostring),
                      title: .title,
                      body: (.body // ""),
                      date: .createdAt } ]
                | sort_by(.date) | reverse' > posts.json

      - name: Roll change into the epoch website commit
        run: |
          git add posts.json
          if git diff --cached --quiet; then
            echo "posts.json unchanged."
            exit 0
          fi
          tree=$(git write-tree)
          new=$(
            GIT_AUTHOR_NAME='llama2700' \
            GIT_AUTHOR_EMAIL='abhi.alavilli@gmail.com' \
            GIT_AUTHOR_DATE='@0 +0000' \
            GIT_COMMITTER_NAME='llama2700' \
            GIT_COMMITTER_EMAIL='abhi.alavilli@gmail.com' \
            GIT_COMMITTER_DATE='@0 +0000' \
            git commit-tree "$tree" -m 'website'
          )
          git update-ref HEAD "$new"
          git push --force origin "HEAD:${{ github.event.repository.default_branch }}"
