<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aalavilli // blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=41">
</head>
<body>
    <main class="container">
        <header class="hero">
            <h1>BLOG</h1>
        </header>

        <section class="block">
            <ul class="feed" id="feed">
                <li class="feed-empty">loading&hellip;</li>
            </ul>
        </section>

        <footer>
            <a href="index.html">&larr; home</a>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
        (function () {
            const feed = document.getElementById('feed');

            if (window.marked) marked.setOptions({ gfm: true, breaks: true });

            function renderMarkdown(el, md) {
                const src = md || '';
                if (window.marked && window.DOMPurify) {
                    el.innerHTML = DOMPurify.sanitize(marked.parse(src));
                } else {
                    el.textContent = src;
                }
            }

            function fmtDate(iso) {
                const d = new Date(iso);
                if (isNaN(d)) return '';
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
            }

            function render(posts) {
                feed.innerHTML = '';
                if (!posts.length) {
                    const li = document.createElement('li');
                    li.className = 'feed-empty';
                    li.textContent = 'nothing here yet.';
                    feed.appendChild(li);
                    return;
                }
                posts
                    .slice()
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .forEach(p => {
                        const li = document.createElement('li');
                        li.className = 'post';

                        const h = document.createElement('h2');
                        h.className = 'post-title';
                        h.textContent = p.title || '(untitled)';

                        const date = document.createElement('div');
                        date.className = 'post-date';
                        date.textContent = fmtDate(p.date);

                        const body = document.createElement('div');
                        body.className = 'post-body';
                        renderMarkdown(body, p.body);

                        li.append(h, date, body);
                        feed.appendChild(li);
                    });
            }

            fetch('posts.json?t=' + Date.now())
                .then(r => r.ok ? r.json() : [])
                .then(render)
                .catch(() => render([]));
        })();
    </script>
    <script src="topbar.js"></script>
</body>
</html>
