<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>aalavilli // blog</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
		<link rel="stylesheet" href="/style.css">
	</head>

	<body>
		<div class="strip" id="visitor"></div>

		<main>
			<h1>Blog</h1>
			
			<ol class="feed" id="feed">
				<li class="empty">loading&hellip;</li>
			</ol>
			
			<a class="back" href="/">&larr; home</a>
			
			<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
			<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
			<script>
				const feed = document.getElementById('feed');
			
				function post(p) {
					const date = new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
					const li = document.createElement('li');
					li.innerHTML = `<h2></h2><time>${date}</time><div class="post-body"></div>`;
					li.querySelector('h2').textContent = p.title || '(untitled)';
			
					const body = li.querySelector('.post-body');
					if (window.marked && window.DOMPurify)
						body.innerHTML = DOMPurify.sanitize(marked.parse(p.body || '', { breaks: true }));
					else
						body.textContent = p.body || '';
					return li;
				}
			
				fetch('/posts.json?t=' + Date.now())
					.then(r => r.ok ? r.json() : [])
					.catch(() => [])
					.then(posts => {
						posts.sort((a, b) => new Date(b.date) - new Date(a.date));
						feed.replaceChildren(...posts.map(post));
						if (!posts.length)
							feed.innerHTML = '<li class="empty">nothing here yet.</li>';
					});
			</script>
		</main>

		<script src="/site.js"></script>
	</body>
</html>
